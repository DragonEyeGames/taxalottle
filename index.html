<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxalottle</title>

    <style>

        @font-face {
            font-family:"Irish Grover";
            src: url('fonts/IrishGrover-Regular.ttf')
        }

        #logo {
            color:Blue;
            font-size:6.5em;
            font-family: "Irish Grover";
            text-align:center;
            padding-top:0em;
            margin-top:0em;
            margin-bottom:0px;
            -webkit-text-stroke: .001px black;
        }

        p {
            text-align:center;
            font-size:20px;
            color:black;
        }

        body {
            background-color:LightBlue;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .grid-button {
            #The Grid Layout;
            display:flex;
            justify-content:center;
            align-items:center;
            padding: 20px;
            height:90px;
            border-style:solid;
            background-color:rgb(73, 165, 109);
            border-radius:15px;
            #The Font Stuff;
            font-size:2.4em;

            transition: transform 0.3s ease-in-out, background-color 0.1s ease;
        }

        .grid-button:hover {
            background-color: #2ecc71;
            transform: scale(1.01); /* Scales the element up by 5% */
        }

        a {
            text-decoration: none;
            color:black;
        }

        .taxalottle {
            width:100px;
            height:100px;
            animation-name:rotate;
            animation-duration:1s;
            animation-iteration-count:infinite;
            animation-timing-function: linear;
        }

        .img_left {
            position:fixed;
            top:20px;
            left:100px;
            animation-direction:alternate;
        }

        .img_right {
            position:fixed;
            top:20px;
            right:100px;
            animation-direction:alternate-reverse;
        }

        @keyframes rotate {
            from {rotate:-10deg;}
            to {rotate:10deg;}
        }

    </style>
</head>
<body>
    <h1 id="logo">Taxalottle</h1>
    <p>Come learn about me!</p>

    <img class="taxalottle img_left" src="images/Taxalottle_No_BG.png" alt="Taxalottle Logo">
    <img class="taxalottle img_right" src="images/Taxalottle_No_BG.png" alt="Taxalottle Logo">

    <div class="grid-container">
        <a href=pets.html class="grid-button">My Dogs</a>
        <a href=pets.html class="grid-button">My Projects</a>
        <a href=pets.html class="grid-button">All About Me</a>
        <a href=pets.html class="grid-button">My Long-Term Goals</a>
    </div>

</body>
</html>
