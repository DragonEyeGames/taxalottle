<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxalottle</title>

    <style>
        #logo {
            color:Blue;
            font-size:6.5em;
            text-align:center;
            padding-top:0em;
            margin-top:0em;
            margin-bottom:0px;
            -webkit-text-stroke: 2px black;
        }

        p {
            text-align:center;
            font-size:20px;
            color:black;
        }

        body {
            background-color:LightBlue;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .grid-item {
            #The Grid Layout;
            display:flex;
            justify-content:center;
            align-items:center;
            padding: 20px;
            height:90px;
            border-style:solid;
            background-color:rgb(73, 165, 109);

            #The Font Stuff;
            font-size:2.4em;
        }

        a {
            text-decoration: none;
            color:black;
        }

    </style>
</head>
<body>
    <h1 id="logo">Taxalottle</h1>
    <p>Come learn about me!</p>

    <div class="grid-container">
        <div class="grid-item"><a href=pets.html>Dogs</a></div>
        <div class="grid-item">Projects</div>
        <div class="grid-item">Me</div>
        <div class="grid-item">Goals</div>
    </div>

</html>
